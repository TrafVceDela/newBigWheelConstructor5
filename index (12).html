        outline: none;

        border-color: #7dd3fc;
      }
      .accordion-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-in-out;
      }
      .accordion-header i {
        transition: transform 0.3s ease-in-out;
      }
      .accordion-item.open .accordion-content {
        max-height: 1000px; /* Large enough to fit content */
      }
      .accordion-item.open .accordion-header i {
        transform: rotate(180deg);
      }
      /* Custom Toggle Switch Styles */
      .toggle-checkbox {
        @apply: absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer;
        right: 1rem;
        transition: right 0.2s ease-in-out;
      }
      .toggle-checkbox:checked {
        right: 0.1rem;
        border-color: #0ea5e9; /* cyan-600 */
      }
      .toggle-label {
        @apply: block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer;
        transition: background-color 0.2s ease-in-out;
      }
      .toggle-checkbox:checked + .toggle-label {
        background-color: #0ea5e9; /* cyan-600 */
      }

          <style>
            body {
              font-family: "Share Tech Mono", monospace;
              text-shadow: 0 0 3px rgba(57, 255, 20, 0.4);
              background-color: #000;
              overflow-x: hidden;
              color: rgb(74 222 128 / 1);
            }

            .cursor::after {
              content: "_";
              animation: blink 1s step-end infinite;
            }

            @keyframes blink {
              50% {
                opacity: 0;
              }
            }

            .hacker-input:focus {
              box-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
            }

            .blinking-red {
              color: #ef4444;
              animation: blink-red 1.5s step-end infinite;
            }

            @keyframes blink-red {
              50% {
                opacity: 0.5;
              }
            }

            .shake {
              animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            }

            @keyframes shake {
              10%,
              90% {
                transform: translate3d(-1px, 0, 0);
              }

              20%,
              80% {
                transform: translate3d(2px, 0, 0);
              }

              30%,
              50%,
              70% {
                transform: translate3d(-4px, 0, 0);
              }

              40%,
              60% {
                transform: translate3d(4px, 0, 0);
              }
            }

            .signal-card {
              transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .signal-card:hover:not(.locked-card) {
              transform: translateY(-5px);
              box-shadow: 0 0 25px rgba(57, 255, 20, 0.5);
            }

            #chat-widget {
              transition: all 0.3s ease-in-out;
            }

            #chat-messages::-webkit-scrollbar {
              width: 4px;
            }

            #chat-messages::-webkit-scrollbar-track {
              background: #1a1a1a;
            }

            #chat-messages::-webkit-scrollbar-thumb {
              background: #00ff00;
            }

            #live-feed-container {
              mask-image: linear-gradient(
                to right,
                transparent,
                black 5%,
                black 95%,
                transparent
              );
              -webkit-mask-image: linear-gradient(
                to right,
                transparent,
                black 5%,
                black 95%,
                transparent
              );
            }

            .winner-item {
              animation: slideInFromLeft 0.5s ease-out forwards;
              gap: 10px;
            }

            @keyframes slideInFromLeft {
              from {
                opacity: 0;
                transform: translateX(-30px);
              }

              to {
                opacity: 1;
                transform: translateX(0);
              }
            }

            .btn-disabled {
              background-color: #4a5568;
              cursor: not-allowed;
              color: #a0aec0;
            }

            .multiplier-rising {
              text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
              color: #63b3ed;
            }

            .multiplier-final {
              color: #48bb78;
              text-shadow: 0 0 20px rgba(72, 187, 120, 0.8);
            }

            .custom-select-options {
              animation: fadeIn 0.2s ease-out;
            }

            @keyframes fadeIn {
              from {
                opacity: 0;
                transform: translateY(-10px);
              }

              to {
                opacity: 1;
                transform: translateY(0);
              }
            }

            .mine-cell {
              background-color: #1a202c;
              border-radius: 0.375rem;
              transition: all 0.3s ease-in-out;
              cursor: default;
            }

            .mine-cell.safe {
              background-image: url(https://www.freeiconspng.com/uploads/yellow-christmas-star-png-18.png);
              background-size: 70%;
              background-position: center;
              background-repeat: no-repeat;
              background-color: #38a169;
              transform: scale(1.05);
              box-shadow: 0 0 15px rgba(56, 161, 105, 0.7);
            }

            .game-console {
              background-color: #0d1117;
              border-color: #30363d;
              height: 8rem;
            }

            .game-console p {
              animation: fadeInConsole 0.3s ease-in;
              color: #a5d6ff;
            }

            .game-console p.success {
              color: #56d364;
            }

            .game-console p.error {
              color: #f85149;
            }

            @keyframes fadeInConsole {
              from {
                opacity: 0;
              }

              to {
                opacity: 1;
              }
            }

            .penalty-gate-post {
              background-color: #a0aec0;
            }

            .penalty-target-zone {
              background-color: rgba(255, 255, 255, 0.1);
              border: 2px dashed rgba(255, 255, 255, 0.2);
              transition: all 0.3s ease-in-out;
            }

            .penalty-target-zone.highlight {
              background-color: rgba(56, 161, 105, 0.8);
              border-color: #f6e05e;
              box-shadow: 0 0 25px rgba(56, 161, 105, 0.9);
            }

            .number-signal-display {
              color: #48bb78;
              text-shadow: 0 0 20px rgba(72, 187, 120, 0.8);
            }

            #chicken-road-viewport {
              overflow: hidden;
              background: linear-gradient(to bottom, #1a202c, #2d3748);
            }

            #chicken-road-track {
              transition: transform 0.2s linear;
            }

            .chicken-stove {
              background-color: #4a5568;
              border: 2px solid #718096;
              box-shadow: 0 4px 0 #2d3748;
            }

            #chicken-icon {
              transition: transform 0.2s ease-out;
              z-index: 10;
            }

            .locked-card {
              cursor: not-allowed;
              pointer-events: none;
            }

            .shimmer-btn {
              position: relative;
              overflow: hidden;
              background: #1a202c;
              border: 1px solid #f6e05e;
              color: #f6e05e;
              transition: all 0.3s;
            }

            .shimmer-btn:hover {
              box-shadow: 0 0 15px rgba(246, 224, 94, 0.6);
            }

            .shimmer-btn::before {
              content: "";
              position: absolute;
              top: 0;
              left: -150%;
              width: 75%;
              height: 100%;
              background: linear-gradient(
                90deg,
                transparent,
                rgba(246, 224, 94, 0.4),
                transparent
              );
              animation: shimmer 5s infinite linear;
            }

            @keyframes shimmer {
              0% {
                transform: translateX(0);
              }

              100% {
                transform: translateX(350%);
              }
            }

            .blinking-text {
              animation: blink-gray-red 1.5s infinite;
            }

            @keyframes blink-gray-red {
              0%,
              100% {
                color: #6b7280;
              }

              50% {
                color: #ef4444;
              }
            }
          </style>
        </head>

                  for (let i = 0; i < numSegments; i++) {
                    const startAngle = i * segmentAngle;
                    const endAngle = startAngle + segmentAngle;

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius, startAngle, endAngle);
                    ctx.closePath();
                    ctx.fillStyle = prizes[i].color;
                    ctx.fill();

                    if (prizes[i].animatedBorder) {
                      const gradient = ctx.createConicGradient(
                        shimmerAngle + startAngle,
                        0,
                        0
                      );
                      gradient.addColorStop(0, "#FBBF24");
                      gradient.addColorStop(0.25, "#FDE68A");
                      gradient.addColorStop(0.5, "#FBBF24");
                      gradient.addColorStop(0.75, "#FFFFFF");
                      gradient.addColorStop(1, "#FBBF24");
                      ctx.strokeStyle = gradient;
                      ctx.lineWidth = 6;
                      ctx.stroke();
                    } else {
                      ctx.strokeStyle = "#4B5563";
                      ctx.lineWidth = 2;
                      ctx.stroke();
                    }

                    ctx.save();
                    ctx.rotate(startAngle + segmentAngle / 2);
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillStyle = prizes[i].textColor;
                    const fontSize = Math.max(10, Math.floor(radius / 16));
                    ctx.font = `bold ${fontSize}px "Share Tech Mono"`;
                    const text = prizes[i].text;

                    const lines = text.split("\n");
                    const textRadius = radius * 0.65;
                    const lineHeight = fontSize + 2;
                    for (let j = 0; j < lines.length; j++) {
                      ctx.fillText(
                        lines[j],
                        textRadius,
                        (j - (lines.length - 1) / 2) * lineHeight
                      );
                    }
                    ctx.restore();
                  }
                  ctx.restore();
                }

                function idleLoop() {
                  shimmerAngle += 0.03;
                  drawWheel();
                  if (!isSpinning) {
                    animationFrameId = requestAnimationFrame(idleLoop);
                  }
                }

                function startConfetti() {
                  if (!confettiCanvas || !confettiCtx) return;
                  const colors = [
                    "#fde047",
                    "#f97316",
                    "#22c55e",
                    "#3b82f6",
                    "#a855f7",
                  ];
                  confettiParticles = [];
                  for (let i = 0; i < 150; i++) {
                    confettiParticles.push({
                      x: confettiCanvas.width / 2,
                      y: confettiCanvas.height / 2,
                      radius: Math.random() * 3 + 2,
                      color: colors[Math.floor(Math.random() * colors.length)],
                      vx: (Math.random() - 0.5) * 25,
                      vy: (Math.random() - 0.5) * 25,
                      alpha: 1,
                    });
                  }

                  function animateConfetti() {
                    if (!confettiCtx || !confettiCanvas) return;
                    confettiCtx.clearRect(
                      0,
                      0,
                      confettiCanvas.width,
                      confettiCanvas.height
                    );
                    confettiParticles.forEach((p, index) => {
                      p.x += p.vx;
                      p.y += p.vy;
                      p.vy += 0.4; // gravity
                      p.alpha -= 0.005;

                      if (p.alpha <= 0) {
                        confettiParticles.splice(index, 1);
                      }

                      confettiCtx.globalAlpha = p.alpha;
                      confettiCtx.beginPath();
                      confettiCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                      confettiCtx.fillStyle = p.color;
                      confettiCtx.fill();
                    });

                    if (confettiParticles.length > 0) {
                      confettiAnimationId =
                        requestAnimationFrame(animateConfetti);
                    } else {
                      confettiCtx.clearRect(
                        0,
                        0,
                        confettiCanvas.width,
                        confettiCanvas.height
                      );
                    }
                  }
                  cancelAnimationFrame(confettiAnimationId);
                  animateConfetti();
                }

                function spinWheel() {
                  if (isSpinning) return;
                  const code = lotteryCodeInput.value.trim();
                  if (!code) {
                    lotteryErrorMessage.textContent = "Please enter the code.";
                    const modalBody = lotteryModal.querySelector(
                      ".bg-\\[\\#0d0d0d\\]"
                    );
                    if (modalBody) {
                      modalBody.classList.add("shake");
                      setTimeout(
                        () => modalBody.classList.remove("shake"),
                        500
                      );
                    }
                    return;
                  }

                  let usedCodes =
                    JSON.parse(sessionStorage.getItem("usedLotteryCodes")) ||
                    [];
                  if (usedCodes.includes(code)) {
                    lotteryErrorMessage.textContent = "This code was used.";
                    return;
                  }

                  if (!lotteryCodes.hasOwnProperty(code)) {
                    lotteryErrorMessage.textContent = "Wrong code.";
                    const modalBody = lotteryModal.querySelector(
                      ".bg-\\[\\#0d0d0d\\]"
                    );
                    if (modalBody) {
                      modalBody.classList.add("shake");
                      setTimeout(
                        () => modalBody.classList.remove("shake"),
                        500
                      );
                    }
                    return;
                  }

                  let targetPrizeIndex = -1;

                  if (lotteryCodes[code]) {
                    targetPrizeIndex = lotteryCodes[code];
                    usedCodes.push(code);
                    sessionStorage.setItem(
                      "usedLotteryCodes",
                      JSON.stringify(usedCodes)
                    );
                  } else {
                    const nothingIndexes = prizes
                      .map((p, i) =>
                        p.text.toUpperCase() === "NOTHING" ? i : -1
                      )
                      .filter((i) => i !== -1);
                    if (nothingIndexes.length > 0) {
                      targetPrizeIndex =
                        nothingIndexes[
                          Math.floor(Math.random() * nothingIndexes.length)
                        ];
                    } else {
                      targetPrizeIndex = Math.floor(
                        Math.random() * prizes.length
                      );
                    }
                    if (code) {
                      lotteryErrorMessage.textContent = "Invalid code.";
                      if (lotteryModal) {
                        const modalBody = lotteryModal.querySelector(
                          ".bg-\\[\\#0d0d0d\\]"
                        );
                        if (modalBody) {
                          modalBody.classList.add("shake");
                          setTimeout(
                            () => modalBody.classList.remove("shake"),
                            500
                          );
                        }
                      }
                      return;
                    }
                  }

                  cancelAnimationFrame(animationFrameId);
                  lotteryErrorMessage.textContent = "";
                  isSpinning = true;
                  spinBtn.disabled = true;

                  const randomSpins = Math.floor(Math.random() * 4) + 5;
                  const targetSegmentCenter =
                    targetPrizeIndex * segmentAngle + segmentAngle / 2;
                  const finalRotation =
                    2 * Math.PI * randomSpins -
                    targetSegmentCenter +
                    (Math.random() * segmentAngle * 0.8 - segmentAngle * 0.4);

                  let start = null;
                  const duration = 6000;
                  const startRotation = currentRotation;

                  function easeOutQuint(t) {
                    return 1 + --t * t * t * t * t;
                  }

                  function animateSpin(timestamp) {
                    if (!start) start = timestamp;
                    const progress = timestamp - start;
                    const easedProgress = easeOutQuint(
                      Math.min(progress / duration, 1)
                    );

                    currentRotation =
                      startRotation +
                      (finalRotation - startRotation) * easedProgress;
                    shimmerAngle += 0.05;
                    drawWheel();

                    if (progress < duration) {
                      requestAnimationFrame(animateSpin);
                    } else {
                      isSpinning = false;
                      currentRotation %= 2 * Math.PI;

                      const winningIndex =
                        Math.floor(
                          numSegments -
                            (currentRotation % (2 * Math.PI)) / segmentAngle
                        ) % numSegments;
                      const winningPrize = prizes[winningIndex];

                      lotteryControls.classList.add("hidden");
                      lotteryResultText.textContent = winningPrize.text.replace(
                        /\n/g,
                        " "
                      );
                      lotteryResult.classList.remove("hidden");

                      if (winningPrize.text.toUpperCase() !== "NOTHING") {
                        startConfetti();
                      }

                      idleLoop();
                    }
                  }
                  requestAnimationFrame(animateSpin);
                }

                function openLotteryModal() {

          }
        });

        // --- Generation and Download logic ---
        const generateBtn = document.getElementById("generateBtn");
        generateBtn.addEventListener("click", () => {
          const originalHtmlTemplate = document.getElementById("original-html");
          let modifiedHtml = originalHtmlTemplate.innerHTML;

          // General settings
          const currency = document.getElementById("currency").value;
          const minBet = document.getElementById("minBet").value;
          const maxBet = document.getElementById("maxBet").value;
          const winnerMultiplier =
            document.getElementById("winnerMultiplier").value;
          const enableBetStep =
            document.getElementById("enableBetStep").checked;
          const enableLottery =
            document.getElementById("enableLottery").checked;

          const newCustomConfigString = `const CUSTOM_CONFIG = {\n                  currency: "${currency}",\n                  minBet: ${minBet},\n                  maxBet: ${maxBet},\n                  winnerMultiplier: ${winnerMultiplier},\n                };`;
          const newFeatureFlagsString = `const FEATURE_FLAGS = {\n                  enableBetStep: ${enableBetStep},\n                  enableLottery: ${enableLottery},\n                };`;

          // Video settings
          const newVideoConfig = { ...initialVideoConfig };
          const videoInputs = document.querySelectorAll(
            ".config-input[data-game]"
          );
          videoInputs.forEach((input) => {
            const { game, type, index } = input.dataset;
            newVideoConfig[game][type][parseInt(index)].url = input.value;
          });
          const newVideoConfigString = `const VIDEO_CONFIG = ${JSON.stringify(
            newVideoConfig,
            null,
            18
          )};`;

          // Wheel of Fortune settings
          const configuredPrizes = [];
          const configuredLotteryCodes = {};
          const prizeElements =
            wheelPrizesContainer.querySelectorAll("div[data-index]");
          prizeElements.forEach((el, index) => {
            const text = el.querySelector(".prize-text-input").value;
            const color = el.querySelector(".prize-color-input").value;
            const specialCode = el
              .querySelector(".prize-code-input")
              .value.trim();
            const prize = {
              text: text,
              color: color,
              textColor: "#FFFFFF", // Assuming white text for all
              animatedBorder:
                text.includes("100$") || text.includes("PERSONAL"),
            };
            configuredPrizes.push(prize);
            if (specialCode && specialCode.length === 4) {
              configuredLotteryCodes[specialCode] = index;
            }
          });

          const newPrizesString = `const prizes = ${JSON.stringify(
            configuredPrizes,
            null,
            18
          )};`;
          const newLotteryCodesString = `const lotteryCodes = ${JSON.stringify(
            configuredLotteryCodes,
            null,
            18
          )};`;

          // Replace placeholders
          modifiedHtml = modifiedHtml.replace(
            "// FEATURE_FLAGS_PLACEHOLDER",
            newFeatureFlagsString
          );
          modifiedHtml = modifiedHtml.replace(
            "// PRIZES_PLACEHOLDER",
            newPrizesString
          );
          modifiedHtml = modifiedHtml.replace(
            "// LOTTERY_CODES_PLACEHOLDER",
            newLotteryCodesString
          );
          modifiedHtml = modifiedHtml.replace(
            /const CUSTOM_CONFIG = {[\s\S]*?};/,
            newCustomConfigString
          );
          modifiedHtml = modifiedHtml.replace(
            /const VIDEO_CONFIG = {[\s\S]*?};/,
            newVideoConfigString
          );

          // Trigger download
          const blob = new Blob([modifiedHtml], { type: "text/html" });
          const url = URL.createObjectURL(blob);
          const downloadLink = document.getElementById("downloadLink");
          downloadLink.href = url;
          downloadLink.download = "predictor_configured.html";
          downloadLink.click();
          setTimeout(() => URL.revokeObjectURL(url), 100);
        });

        // Initial render
        renderPrizeInputs();
      });
    </script>
  </body>
</html>
